<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modo Plata 💰</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, #183b35 0%, transparent 35%),
        radial-gradient(circle at top right, #292052 0%, transparent 30%),
        #080b0d;
      color: white;
      min-height: 100vh;
      padding: 18px;
      padding-bottom: 100px;
    }

    .app {
      max-width: 650px;
      margin: auto;
    }

    /* HEADER */

    header {
      text-align: center;
      padding: 20px 10px 25px;
    }

    .logo {
      font-size: 38px;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    header p {
      color: #9ba5a8;
      margin-top: 7px;
      font-size: 15px;
    }

    /* CARDS */

    .card {
      background: rgba(20, 25, 28, 0.88);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 21px;
      margin-bottom: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(15px);
    }

    .card h3 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .sub {
      color: #8d989b;
      line-height: 1.45;
      margin-bottom: 17px;
    }

    /* BALANCE */

    .balance {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 90% 10%, rgba(0,255,170,.28), transparent 30%),
        linear-gradient(135deg, #10241f, #101719 60%, #171326);
      border: 1px solid rgba(0,255,170,.18);
      border-radius: 28px;
      padding: 28px 23px;
      margin-bottom: 18px;
      box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 0 50px rgba(0,255,170,.03);
    }

    .balance::after {
      content: "💰";
      position: absolute;
      right: 18px;
      top: 13px;
      font-size: 45px;
      opacity: .12;
    }
