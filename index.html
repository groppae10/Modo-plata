<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Plata</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #17202a;
      padding: 20px;
    }

    .app {
      max-width: 520px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 6px;
    }

    .header p {
      color: #667085;
    }

    .balance {
      background: #17202a;
      color: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
    }

    .balance small {
      opacity: .75;
    }

    .balance h2 {
      font-size: 34px;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .card h3 {
      margin-bottom: 6px;
      font-size: 21px;
    }

    .sub {
      color: #667085;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .start-box {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 17px;
      font-weight: bold;
      cursor: pointer;
      background: #17202a;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    .change-button {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      width: 100%;
    }

    .expense {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .expense-name {
      width: 100px;
      font-weight: bold;
    }

    .expense button {
      padding: 12px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: #f4f6f8;
      border-radius: 15px;
      padding: 15px;
    }

    .stat small {
      color: #667085;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
    }

    .mode {
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      background: white;
      border: 1px solid #e4e7ec;
    }

    .mode h3 {
      margin-bottom: 7px;
    }

    .mode p {
      color: #667085;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .earning {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .earning:last-child {
      border-bottom: none;
    }

    .earning button {
      padding: 9px 12px;
      font-size: 13px;
    }

    .future {
      text-align: center;
      background: #17202a;
      color: white;
    }

    .future p {
      color: #d0d5dd;
    }

    .dry {
      display: none;
      text-align: center;
      background: #fff1f0;
      border: 1px solid #ffccc7;
    }

    .dry h2 {
      margin-bottom: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .negative {
      color: #d92d20;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
    }

    .modal h3 {
      margin-bottom: 10px;
    }

    .modal p {
      color: #667085;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .secondary {
      background: #e4e7ec;
      color: #17202a;
    }

    @media (max-width: 430px) {
      .expense-name {
        width: 85px;
        font-size: 14px;
      }

      .expense button {
        padding: 11px 9px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ENCABEZADO -->
  <div class="header">
    <h1>💰 Modo Plata</h1>
    <p>Entendé tu plata. Hacela rendir.</p>
  </div>

  <!-- DINERO INICIAL -->
  <div class="card" id="startCard">
    <h3>¿Con cuánto arrancamos?</h3>
    <p class="sub">Ingresá tu dinero disponible.</p>

    <div class="start-box">
      <input
        id="initialMoney"
        type="number"
        placeholder="$ 500000"
      >

      <button onclick="startMoney()">
        Empezar
      </button>
    </div>
  </div>

  <!-- SALDO -->
  <div class="balance">

    <small>Dinero disponible</small>

    <h2 id="balance">$0</h2>

    <button
      class="change-button"
      onclick="changeStartingMoney()"
    >
      ⚙️ Cambiar dinero inicial
    </button>

  </div>

  <!-- GASTOS -->

    <h3>🧾 Mis gastos</h3>

    <p class="sub">
      Cargá un gasto y Modo Plata hace la cuenta.
    </p>

    <div class="expense">

      <div class="expense-name">
        🍔 Comida
      </div>

      <input
        id="food"
        type="number"
        placeholder="$ 50.000"
      >

      <button onclick="addExpense('Comida','food')">
        Aceptar
      </button>

    </div>

    <div class="expense">

      <div class="expense-name">
        🚗 Auto
      </div>

      <input
        id="car"
        type="number"
        placeholder="$ 20.000"
      >

      <button onclick="addExpense('Auto','car')">
        Aceptar
      </button>

    </div>

    <div class="expense">

      <div class="expense-name">
        🏠 Alquiler
      </div>

      <input
        id="rent"
        type="number"
        placeholder="$ 300.000"
      >

      <button onclick="addExpense('Alquiler','rent')">
        Aceptar
      </button>

    </div>

      <div class="expense-name">
        ➕ Otro
      </div>

      <input
